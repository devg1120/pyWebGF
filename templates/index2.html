<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ディレクトリ切り替えグラフ</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            padding-top: 140px; 
            background-color: #f9f9f9;
        }
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 110px;
            background-color: #ffffff;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
            box-sizing: border-box;
        }
        .content {
            padding: 20px 30px;
        }
        .form-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        select { padding: 6px 12px; font-size: 14px; }
        h1 { color: #333; margin: 0 0 10px 0; font-size: 22px; }
        h2 { color: #555; margin: 0 0 15px 0; font-size: 18px; }
        label { font-weight: bold; font-size: 14px; color: #444; }
    </style>
</head>
<body>
    <div class="fixed-header">
        <h1>データソース・時間範囲の選択</h1>
        <form method="get" action="/">
            <div class="form-group">
                <!-- ディレクトリ選択 -->
                <div>
                    <label for="dir-select">ディレクトリ: </label>
                    <select id="dir-select" name="dir" onchange="this.form.submit()">
                        {% for d in sub_directories %}
                            <option value="{{ d }}" {% if d == selected_dir %}selected{% endif %}>{{ d }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- 開始位置選択（0時〜23時） -->
                <div>
                    <label for="start-select">開始時間: </label>
                    <select id="start-select" name="start_hour" onchange="this.form.submit()">
                        {% for h in range(0, 24) %}
                            <option value="{{ h }}" {% if h == start_hour %}selected{% endif %}>{{ h }}時</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- 終了位置選択（0時〜23時） -->
                <div>
                    <label for="end-select">終了時間: </label>
                    <select id="end-select" name="end_hour" onchange="this.form.submit()">
                        {% for h in range(0, 24) %}
                            <option value="{{ h }}" {% if h == end_hour %}selected{% endif %}>{{ h }}時</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </form>
    </div>

    <div class="content">
        <h2>「{{ selected_dir }}」のグラフ一覧 (範囲: {{ start_hour }}:00 〜 {{ end_hour }}:55)</h2>
        {% if plot_url %}
            <img src="data:image/png;base64,{{ plot_url }}" alt="時系列グラフ">
        {% else %}
            <p>選択されたディレクトリにCSVファイルがないか、読み込みに失敗しました。</p>
        {% endif %}
    </div>
</body>
</html>
